# dsh-theme-jarvis bundle layer.
# `dsh plugin --profile web add <package>` 会通过 pnpm 安装本包，并把声明了
# dsh.bundle 的依赖自动追加进 profile 的 dsh.profile.bundles；本层负责向组合
# 插入主题行。安装/升级后需要重启 `dsh web` 生效。
#
# 浏览器端偏好（主题/特效/唤醒词等）由设置面板 + localStorage 管理，不在行
# 配置里。行配置只承载 host 侧的云端 STT 转发参数（OpenAI 兼容
# /audio/transcriptions 端点）：
#   stt.apiKey  留空时读环境变量 DSH_JARVIS_STT_KEY
#   stt.baseUrl 默认 SiliconFlow（SenseVoiceSmall 免费额度）；阿里云百炼可改
#               https://dashscope.aliyuncs.com/compatible-mode/v1
#   stt.model   默认 FunAudioLLM/SenseVoiceSmall；百炼用 paraformer-v2
- insert:
    - id: ui-theme-jarvis
      name: 'dsh-theme-jarvis'
      config:
        stt:
          apiKey: ''
          baseUrl: 'https://api.siliconflow.cn/v1'
          model: 'FunAudioLLM/SenseVoiceSmall'
